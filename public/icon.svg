<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#1d2530"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.55" stop-color="#d4af4a"/>
      <stop offset="1" stop-color="#8a7423"/>
    </linearGradient>
    <radialGradient id="lens" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#26303c"/>
      <stop offset="1" stop-color="#10151b"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- deco frame: a double rule with stepped corners -->
  <g fill="none" stroke="#8a7423" stroke-width="4">
    <path d="M72 40H440L472 72V440L440 472H72L40 440V72Z"/>
  </g>
  <g fill="none" stroke="#4d4116" stroke-width="3">
    <path d="M82 54H430L458 82V430L430 458H82L54 430V82Z"/>
  </g>
  <!-- the glass -->
  <g transform="translate(18 18)">
    <line x1="300" y1="300" x2="392" y2="392" stroke="url(#brass)" stroke-width="42" stroke-linecap="round"/>
    <line x1="300" y1="300" x2="330" y2="330" stroke="#4d4116" stroke-width="46" stroke-linecap="butt"/>
    <circle cx="220" cy="220" r="112" fill="url(#lens)" stroke="url(#brass)" stroke-width="26"/>
    <circle cx="220" cy="220" r="94" fill="none" stroke="#4d4116" stroke-width="3"/>
    <!-- the keyhole -->
    <circle cx="220" cy="198" r="32" fill="url(#brass)"/>
    <path d="M204 214H236L252 286H188Z" fill="url(#brass)"/>
    <!-- a glint -->
    <path d="M160 170A72 72 0 0 1 206 140" fill="none" stroke="#ece4d0" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
